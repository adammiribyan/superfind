name: test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: test-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
      - id: files
        name: Does this change touch anything but docs?
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          [ "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 3 ] || { echo "::error::expected the pull request's merge commit"; exit 1; }
          git diff --name-only --no-renames HEAD^1 HEAD > files
          echo "$(wc -l < files) files changed"
          status=0
          code=$(grep -v -E '^([^/]+\.md|docs/.+\.(md|png|jpe?g|gif|svg|webp)|assets/.+\.(png|jpe?g|gif|svg|webp|ico))$' files) || status=$?
          [ "$status" -le 1 ] || { echo "::error::could not classify the changed files"; exit 1; }
          if [ -s files ] && [ -z "$code" ]; then
            echo "docs only: skipping the Go and behavior jobs"
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code changes:"; echo "$code" | head -20
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  checks:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    name: checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install tmux, zsh, and fish
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update -qq && sudo apt-get install -y -qq tmux zsh fish; else brew install tmux fish; fi
      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...
      - name: Unit tests under the race detector
        run: go test -race ./...
      - name: Build
        run: go build -o bin/superfind .
      - name: Behavior tests
        run: python3 .github/workflows/behavior.py run 1 1 4 counts.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: counts-${{ matrix.os }}-plain-1
          path: counts.json
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7

  race:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        shard: [1, 2]
    name: race (${{ matrix.os }}, ${{ matrix.shard }}/2)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install tmux, zsh, and fish
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update -qq && sudo apt-get install -y -qq tmux zsh fish; else brew install tmux fish; fi
      - name: Build under the race detector
        run: go build -race -o bin/superfind .
      - name: Behavior tests under the race detector, shard ${{ matrix.shard }} of 2
        run: python3 .github/workflows/behavior.py run ${{ matrix.shard }} 2 4 counts.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: counts-${{ matrix.os }}-race-${{ matrix.shard }}
          path: counts.json
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7

  install:
    needs: [changes, checks]
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    name: install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Piped to sh, install.sh installs the latest release
        run: |
          export HOME="$RUNNER_TEMP/home" SHELL=/bin/bash
          mkdir "$HOME"
          cd "$RUNNER_TEMP"
          sh < "$GITHUB_WORKSPACE/install.sh"
          "$HOME/.local/bin/superfind" --version
          rc=.bashrc
          if [ "$RUNNER_OS" = macOS ]; then rc=.bash_profile; fi
          grep -F '/.local/bin/superfind" init bash)"' "$HOME/$rc"

  test:
    needs: [changes, checks, race, install]
    if: always()
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            skips: ""
          - os: macos-latest
            skips: test_superfind.SuperfindBehavior.test_output_that_cannot_be_written_is_an_error
    name: test (${{ matrix.os }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: The changes job succeeded
        run: test "${{ needs.changes.result }}" = success
      - name: Docs-only changes need no tests
        if: needs.changes.outputs.code == 'false'
        run: echo "docs only; the Go and behavior jobs were skipped"
      - name: Every job passed
        if: needs.changes.outputs.code != 'false'
        run: |
          echo "checks=${{ needs.checks.result }} race=${{ needs.race.result }} install=${{ needs.install.result }}"
          test "${{ needs.checks.result }}" = success
          test "${{ needs.race.result }}" = success
          test "${{ needs.install.result }}" = success
      - uses: actions/checkout@v4
        if: needs.changes.outputs.code != 'false'
      - uses: actions/download-artifact@v4
        if: needs.changes.outputs.code != 'false'
        with:
          pattern: counts-${{ matrix.os }}-plain-*
          path: counts/plain
      - uses: actions/download-artifact@v4
        if: needs.changes.outputs.code != 'false'
        with:
          pattern: counts-${{ matrix.os }}-race-*
          path: counts/race
      - name: Every behavior test ran once on ${{ matrix.os }}, in each build
        if: needs.changes.outputs.code != 'false'
        run: |
          echo "plain build:"; python3 .github/workflows/behavior.py total counts/plain ${{ matrix.skips }}
          echo "race build:"; python3 .github/workflows/behavior.py total counts/race ${{ matrix.skips }}
