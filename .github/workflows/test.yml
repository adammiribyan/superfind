name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      macos:
        description: Also run every job on macOS, as a release does
        type: boolean
        default: false
  workflow_call:
    inputs:
      macos:
        type: boolean
        default: false

concurrency:
  group: test-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && !inputs.macos && github.sha || github.ref }}${{ inputs.macos && '-macos' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request' || github.event_name == 'push' && !inputs.macos
        with:
          fetch-depth: ${{ github.event_name == 'push' && '0' || '2' }}
      - id: files
        name: Does this change touch anything but docs and the demo?
        env:
          GH_TOKEN: ${{ github.token }}
          MACOS: ${{ inputs.macos }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$MACOS" = true ] || [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            for head in $(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[] | select(.merged_at != null) | .head.sha'); do
              passed=$(gh api "repos/$GITHUB_REPOSITORY/commits/$head/check-runs?check_name=test%20(ubuntu-latest)" --jq '[.check_runs[] | select(.conclusion == "success")] | length')
              if [ "$passed" -gt 0 ]; then
                echo "merged from a pull request whose test (ubuntu-latest) passed on $head: skipping the Go and behavior jobs"
                echo "code=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            done
            if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            git diff --name-only --no-renames "$BEFORE" HEAD > files
          else
            [ "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 3 ] || { echo "::error::expected the pull request's merge commit"; exit 1; }
            git diff --name-only --no-renames HEAD^1 HEAD > files
          fi
          echo "$(wc -l < files) files changed"
          status=0
          code=$(grep -v -E '^([^/]+\.md|docs/.+\.(md|png|jpe?g|gif|svg|webp)|assets/.+\.(png|jpe?g|gif|svg|webp|ico)|demo/.+\.(py|tape|gif))$' files) || status=$?
          [ "$status" -le 1 ] || { echo "::error::could not classify the changed files"; exit 1; }
          if [ -s files ] && [ -z "$code" ]; then
            echo "docs and demo only: skipping the Go and behavior jobs"
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code changes:"; echo "$code" | head -20
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  checks:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.macos && '["ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
    name: checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install tmux, zsh, and fish
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update -qq && sudo apt-get install -y -qq tmux zsh fish; else brew install tmux fish; fi
      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...
      - name: Unit tests under the race detector
        run: go test -race ./...
      - name: Build
        run: go build -o bin/superfind .
      - name: Behavior tests
        run: python3 .github/workflows/behavior.py run 1 1 4 counts.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: counts-${{ matrix.os }}-plain-1
          path: counts.json
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7

  race:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.macos && '["ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
        shard: [1, 2]
    name: race (${{ matrix.os }}, ${{ matrix.shard }}/2)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install tmux, zsh, and fish
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update -qq && sudo apt-get install -y -qq tmux zsh fish; else brew install tmux fish; fi
      - name: Build under the race detector
        run: go build -race -o bin/superfind .
      - name: Behavior tests under the race detector, shard ${{ matrix.shard }} of 2
        run: python3 .github/workflows/behavior.py run ${{ matrix.shard }} 2 4 counts.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: counts-${{ matrix.os }}-race-${{ matrix.shard }}
          path: counts.json
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7

  install:
    needs: [changes, checks]
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.macos && '["ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
    name: install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Piped to sh, install.sh installs the latest release
        run: |
          export HOME="$RUNNER_TEMP/home" SHELL=/bin/bash
          mkdir "$HOME"
          cd "$RUNNER_TEMP"
          sh < "$GITHUB_WORKSPACE/install.sh"
          "$HOME/.local/bin/superfind" --version
          rc=.bashrc
          if [ "$RUNNER_OS" = macOS ]; then rc=.bash_profile; fi
          grep -F '/.local/bin/superfind" init bash)"' "$HOME/$rc"

  test:
    needs: [changes, checks, race, install]
    if: always()
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.macos && '[{"os":"ubuntu-latest","skips":""},{"os":"macos-latest","skips":"test_superfind.SuperfindBehavior.test_output_that_cannot_be_written_is_an_error"}]' || '[{"os":"ubuntu-latest","skips":""}]') }}
    name: test (${{ matrix.os }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: The changes job succeeded
        run: test "${{ needs.changes.result }}" = success
      - name: Docs, demo, and already-tested merges need no tests
        if: needs.changes.outputs.code == 'false'
        run: echo "docs and demo only, or a merged pull request; the Go and behavior jobs were skipped"
      - name: Every job passed
        if: needs.changes.outputs.code != 'false'
        run: |
          echo "checks=${{ needs.checks.result }} race=${{ needs.race.result }} install=${{ needs.install.result }}"
          test "${{ needs.checks.result }}" = success
          test "${{ needs.race.result }}" = success
          test "${{ needs.install.result }}" = success
      - uses: actions/checkout@v4
        if: needs.changes.outputs.code != 'false'
      - uses: actions/download-artifact@v4
        if: needs.changes.outputs.code != 'false'
        with:
          pattern: counts-${{ matrix.os }}-plain-*
          path: counts/plain
      - uses: actions/download-artifact@v4
        if: needs.changes.outputs.code != 'false'
        with:
          pattern: counts-${{ matrix.os }}-race-*
          path: counts/race
      - name: Every behavior test ran once on ${{ matrix.os }}, in each build
        if: needs.changes.outputs.code != 'false'
        run: |
          echo "plain build:"; python3 .github/workflows/behavior.py total counts/plain ${{ matrix.skips }}
          echo "race build:"; python3 .github/workflows/behavior.py total counts/race ${{ matrix.skips }}
