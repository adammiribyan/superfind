name: Feature request
description: Suggest something superfind should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you were trying to do
      description: The situation and what got in the way. A real example helps most.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like superfind to do
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
